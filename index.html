<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Happy birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,500&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 🎨 COLORS: change these and the whole site restyles */
:root{--bg:#230a2e;--bg2:#531a60;--ink:#fff0f7;--muted:#efbfe0;--gold:#f6c86b;--rose:#ff8cc6;--on:#2a0d1a;
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:400 18px/1.8 "Manrope",system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 70% at 50% 0,var(--bg2),transparent 70%),radial-gradient(90% 45% at 50% 100%,var(--glow,rgba(255,111,174,.3)),transparent 70%)}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:0}#fx{z-index:20}
main{position:relative;z-index:1}
.serif,h1,h2,.reason,.fin,.sign,.greet,.sub{font-family:"Fraunces",Georgia,serif;font-style:italic}

.hero{min-height:100vh;min-height:100svh;display:grid;place-content:center;text-align:center;padding:calc(24px + var(--top)) 20px 24px}
.greet{margin:0;font-weight:300;font-size:clamp(22px,5.5vw,32px);color:var(--muted);opacity:0;animation:in 1.2s .5s forwards}
h1{margin:.04em 0 .1em;font-weight:300;font-size:clamp(84px,26vw,200px);line-height:1.05;letter-spacing:-.02em;text-shadow:0 0 44px rgba(255,140,198,.5)}
h1 span{display:inline-block;opacity:0;transform:translateY(.4em);filter:blur(10px);animation:letter 1.2s cubic-bezier(.2,.7,.2,1) forwards}
.sub{margin:0 auto;max-width:20em;font-weight:300;font-size:clamp(20px,4.6vw,26px);line-height:1.5;opacity:0;animation:in 1.4s 2.3s forwards}
.cue{display:block;width:12px;height:12px;margin:40px auto 0;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);opacity:0;animation:in 1s .2s forwards}
.late{justify-self:center;margin-top:40px;opacity:0;animation:in 1s 3.7s forwards}

/* gate */
body.locked{overflow:hidden}
.gate{position:fixed;inset:0;z-index:25;display:grid;place-content:center;gap:6px;padding:24px;text-align:center;transition:opacity .7s}
.gate>*{justify-self:center}
.gate.gone{opacity:0;pointer-events:none}
.gift{font-size:112px;line-height:1.2;filter:drop-shadow(0 0 28px rgba(246,200,107,.5));animation:bob 1.8s ease-in-out infinite}
.gone .pals>*{animation:pop .6s forwards}
.gtxt{margin:0 0 24px;font-weight:300;font-size:clamp(24px,6vw,34px);line-height:1.4}
@keyframes bob{50%{transform:translateY(-12px) rotate(-5deg)}}
@keyframes pop{to{transform:scale(2.6);opacity:0}}

/* cake */
.cap{margin:0 0 20px;font-weight:300;font-size:clamp(22px,5.4vw,28px);line-height:1.4}
.cakebox{position:relative;width:min(290px,80vw);margin:0 auto 24px;cursor:pointer}
.glow{position:absolute;inset:-30% -20% -10%;background:radial-gradient(closest-side,rgba(246,200,107,.35),transparent);transition:opacity 1.4s}
.cakebox svg{position:relative;display:block;width:100%;height:auto}
.flame{fill:var(--gold);transform-box:fill-box;transform-origin:50% 100%;filter:drop-shadow(0 0 5px var(--gold));transition:opacity .35s;animation:ignite .5s calc(.5s + var(--i)*.2s) backwards,flick .45s calc(1s + var(--i)*.2s) ease-in-out infinite alternate}
@keyframes ignite{from{transform:scale(0);opacity:0}}
@keyframes flick{to{transform:scale(1.15,.88)}}
.out .flame{opacity:0;animation:none}
.out .glow{opacity:0}

/* heart */
#heartS{padding-inline:6px}
.heart{position:relative;width:min(100%,460px);margin:0 auto}
.heart svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 55%;animation:beat 1.7s 2.4s ease-in-out infinite}
.heart path{fill:rgba(255,124,156,.16);stroke:var(--rose);stroke-width:.8;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;filter:drop-shadow(0 0 6px rgba(255,124,156,.7));animation:draw 2.4s .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes beat{0%,24%,48%,100%{transform:scale(1)}12%{transform:scale(1.04)}36%{transform:scale(1.03)}}
.htxt{position:absolute;left:19%;top:26%;width:62%;height:36%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:500;line-height:1.35}
.htxt p{margin:0;width:100%}
.htxt span{opacity:0;transition:opacity .7s}
.htxt.on span{opacity:1}

/* cute extras */
.hero{position:relative}
.mc{width:84px;height:84px;scale:var(--ms,1);overflow:visible;cursor:pointer;touch-action:manipulation;transform-origin:50% 100%;filter:hue-rotate(var(--hue,0deg)) drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 6px 6px rgba(0,0,0,.3));animation:hop var(--hop,2.3s) var(--d,0s) ease-in-out infinite}
.mc.boing{animation:boing .6s}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-14px) scale(.96,1.05)}55%{transform:scale(1.06,.94)}}
@keyframes boing{30%{transform:translateY(-32px) rotate(-10deg) scale(.9,1.1)}60%{transform:rotate(6deg) scale(1.1,.9)}}
.pals{display:flex;align-items:flex-end;justify-content:center;gap:2px}
.peek{position:absolute;width:76px;height:76px}
.peek.l{left:-4px;bottom:12%}
.peek.r{right:-4px;top:14%;--d:1s}
.cakebox .mc{position:absolute;bottom:-6px;width:64px;height:64px}
.cakebox .l{left:-30px}
.cakebox .r{right:-30px;--d:.8s}
.heart .mc{position:absolute;display:block;width:58px;height:58px;transform-origin:50% 100%;animation:hop var(--hop,2.3s) var(--d,0s) ease-in-out infinite}
.heart .a{left:-2px;top:-10px}
.heart .b{right:-2px;top:-10px;--d:.5s}
.heart .c{left:-4px;bottom:3%;--d:1s}
.heart .d{right:-4px;bottom:3%;--d:1.5s}
.dance{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:28px}
.dance .mc{width:68px;height:68px}
.dance .mc:nth-child(2){--d:.3s}.dance .mc:nth-child(3){--d:.6s}.dance .mc:nth-child(4){--d:.9s}
.dance .mc.wild{animation-duration:.6s}
#open,#blow,#wish{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 10px 40px rgba(255,140,198,.65)}}
@keyframes wave{50%{transform:translateY(-.07em)}}
#cakeS:not([hidden]),#heartS:not([hidden]){animation:popin .8s cubic-bezier(.3,1.5,.5,1)}
@keyframes popin{from{transform:scale(.7);opacity:0}}
.say{position:fixed;z-index:40;padding:6px 12px;border-radius:14px;background:#fff;color:#3a1d3a;font:600 14px "Manrope",system-ui,sans-serif;white-space:nowrap;pointer-events:none;animation:say 1.6s forwards}
.say::after{content:"";position:absolute;left:50%;bottom:-5px;width:11px;height:11px;background:#fff;transform:translateX(-50%) rotate(45deg)}
@keyframes say{0%{opacity:0;transform:translate(-50%,-70%) scale(.6)}15%{opacity:1;transform:translate(-50%,-110%) scale(1)}85%{opacity:1;transform:translate(-50%,-110%)}100%{opacity:0;transform:translate(-50%,-160%)}}

/* balloons you can pop + the finale parade */
.bals{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.bal{position:absolute;bottom:-160px;width:54px;pointer-events:auto;cursor:pointer;touch-action:manipulation;animation:rise var(--t) linear forwards}
.bal svg{display:block;width:100%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));animation:sway 3s ease-in-out infinite alternate}
@keyframes rise{to{transform:translateY(-135vh)}}
@keyframes sway{from{transform:translateX(-14px) rotate(-6deg)}to{transform:translateX(14px) rotate(6deg)}}
.run{position:fixed;left:0;bottom:calc(16px + var(--bot));z-index:22;pointer-events:none;animation:run 6.5s linear backwards}
.run .mc{width:70px;height:70px;animation:hop .55s ease-in-out infinite}
@keyframes run{from{transform:translateX(-110px)}to{transform:translateX(calc(100vw + 30px))}}
@keyframes letter{to{opacity:1;transform:none;filter:none}}
@keyframes in{to{opacity:1}}

section{max-width:640px;margin:0 auto;padding:clamp(56px,12vw,110px) 22px;text-align:center}
h2{margin:0 0 .7em;font-weight:300;font-size:clamp(34px,8vw,52px);line-height:1.2}
.letter{text-align:start}
.letter h2{text-align:center}
.letter p{margin:0 0 1.15em}
.sign{margin:1.2em 0 0;font-weight:500;font-size:30px;line-height:1.3;color:var(--gold)}

.sky{position:relative;height:300px;margin:6px 0 14px}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.sky polyline{fill:none;stroke:rgba(246,200,107,.3);stroke-width:1;stroke-dasharray:3 5;vector-effect:non-scaling-stroke}
.star{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.star::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--muted);opacity:.75;transition:all .5s}
.star:not(.lit)::after{content:"";position:absolute;width:34px;height:34px;border-radius:50%;border:1px solid var(--muted);animation:ping 2.6s ease-out infinite}
.star.lit::before{width:18px;height:18px;background:var(--gold);opacity:1;box-shadow:0 0 18px 6px rgba(246,200,107,.6)}
.star:focus-visible{outline:2px solid var(--gold);border-radius:50%}
@keyframes ping{from{transform:scale(.4);opacity:.8}to{transform:scale(1.2);opacity:0}}
.reason{min-height:4.2em;margin:0;font-weight:300;font-size:clamp(23px,5.6vw,30px);line-height:1.4}
.reason.idle{font:400 16px/1.8 "Manrope",system-ui,sans-serif;color:var(--muted)}
.count{margin:8px 0 0;font-size:15px;color:var(--muted)}

.gal{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -22px;padding:4px 22px 16px;text-align:start}
.gal figure{flex:0 0 min(78vw,320px);margin:0;scroll-snap-align:center}
.gal img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;background:var(--bg2)}
.gal figcaption{margin-top:8px;font-size:15px;color:var(--muted)}

.end{padding-bottom:calc(110px + var(--bot))}
.btn{font:600 18px "Manrope",system-ui,sans-serif;border:0;border-radius:999px;padding:15px 36px;color:var(--on);background:var(--rose);box-shadow:0 10px 30px rgba(255,124,156,.35);cursor:pointer}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.fin{margin:0;font-weight:300;font-size:clamp(30px,8vw,48px);line-height:1.3}

#music{position:fixed;top:calc(14px + var(--top));right:14px;z-index:30;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,243,224,.25);background:rgba(13,10,34,.6);color:var(--gold);font-size:20px;cursor:pointer;backdrop-filter:blur(6px)}

/* design panel: open the page with #design */
#dz{position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:62vh;overflow:auto;padding:10px 16px calc(18px + var(--bot));background:rgba(22,8,32,.97);color:#fff0f7;border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.55);font:14px/1.6 "Manrope",system-ui,sans-serif}
#dz.min{max-height:none;overflow:visible}
#dz.min>:not(.dzh){display:none}
.dzh{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-10px;z-index:1;padding:6px 0;background:rgba(22,8,32,.97)}
#dz h3{margin:14px 0 6px;font:600 13px "Manrope",system-ui,sans-serif;color:#efbfe0}
.dw{display:flex;flex-wrap:wrap;gap:6px}
.dc{font:inherit;color:#fff0f7;background:#3a1a4a;border:1px solid #6a3a7a;border-radius:999px;padding:6px 14px;cursor:pointer}
.dc.on{background:#ff6fae;border-color:#ff6fae;color:#2a0d1a;font-weight:600}
.dc[style*="gradient"].on{outline:2px solid #fff;outline-offset:2px;color:#fff}
.dc.big{padding:10px 18px}
#dz textarea{width:100%;background:#2a1238;color:#fff0f7;border:1px solid #5a2a6a;border-radius:10px;padding:8px;font:inherit;resize:vertical}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  h1 span,.greet,.sub,.cue,.late{opacity:1!important;transform:none!important;filter:none!important}
  .heart path{stroke-dashoffset:0!important}
}
</style>
</head>
<body class="locked">
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="face" viewBox="0 0 100 100">
  <ellipse cx="37" cy="54" rx="4.6" ry="5.8" fill="#3a1d3a"/><ellipse cx="63" cy="54" rx="4.6" ry="5.8" fill="#3a1d3a"/>

<symbol id="cat" viewBox="0 0 100 100">
  <path d="M20 46L22 10L48 30z" fill="#e4d7ff" stroke="#b79be8" stroke-width="2" stroke-linejoin="round"/>

</symbol>
<symbol id="star" viewBox="0 0 100 100">

</symbol>
<symbol id="heartk" viewBox="0 0 100 100"><path d="M50 92C12 66 4 44 4 30 4 15 16 6 29 6 40 6 47 12 50 21 53 12 60 6 71 6 84 6 96 15 96 30 96 44 88 66 50 92Z" fill="#ff7ab8" stroke="#f0589c" stroke-width="2" stroke-linejoin="round"/><ellipse cx="25" cy="24" rx="9" ry="5" transform="rotate(-35 25 24)" fill="#fff" opacity=".55"/></symbol>

<symbol id="balloonk" viewBox="0 0 100 130"><path d="M50 82C14 58 6 40 6 28 6 13 18 4 31 4 41 4 47 10 50 18 53 10 59 4 69 4 82 4 94 13 94 28 94 40 86 58 50 82Z" fill="#ff7ab8"/><ellipse cx="24" cy="22" rx="8" ry="4.5" transform="rotate(-35 24 22)" fill="#fff" opacity=".5"/><path d="M50 82l-6 9h12z" fill="#ff5d9e"/><path d="M50 91q-7 9 0 17t0 20" fill="none" stroke="#fff" stroke-width="1.5" opacity=".7"/></symbol>
</defs></svg>
<button id="music" hidden aria-label="Play or pause music">♪</button>

<div class="gate" id="gate">
  <div class="pals">
    <svg class="mc" data-mc="bunny"></svg>
    <span class="gift" aria-hidden="true">🎁</span>
    <svg class="mc" data-mc="bear" style="--d:.6s"></svg>
  </div>
  <p class="gtxt serif" data-k="gateText"></p>
  <button class="btn" id="open" data-k="openButton"></button>
</div>

<div class="bals" id="bals" aria-hidden="true"></div>
<main>
  <header class="hero" id="hero" hidden>
    <p class="greet" data-k="greeting"></p>
    <h1 id="name"></h1>
    <p class="sub" data-k="subtitle"></p>
    <button class="btn late" id="light" data-k="lightButton"></button>
    <svg class="mc peek l" data-mc="bunny"></svg>
    <svg class="mc peek r" data-mc="bear"></svg>
  </header>

  <section id="cakeS" hidden>
    <p class="cap serif" data-k="candleText"></p>
    <div class="cakebox" id="cake">
      <div class="glow"></div>
      <svg class="mc l" data-mc="cat"></svg><svg class="mc r" data-mc="star"></svg>

        <rect x="40" y="110" width="160" height="66" rx="14" fill="#ff8fb1"/>
        <path d="M44 132q12.65 14 25.3 0t25.3 0t25.3 0t25.3 0t25.3 0t25.3 0V114H44z" fill="#fff3e0"/>
        <rect x="55" y="70" width="130" height="46" rx="10" fill="#b8a6ff"/>

        <g id="candles"></g>
      </svg>
    </div>
    <button class="btn" id="blow" data-k="blowButton"></button>
  </section>

  <section id="heartS" hidden>
    <div class="heart">
      <svg viewBox="0 0 100 90" aria-hidden="true"><path pathLength="100" d="M50 85C20 62 2 44 2 26 2 12 13 3 26 3 36 3 45 8 50 17 55 8 64 3 74 3 87 3 98 12 98 26 98 44 80 62 50 85Z"/></svg>
      <div class="htxt serif" id="htxt" aria-live="polite"><p></p></div>
      <svg class="mc a" data-mc="bunny"></svg><svg class="mc b" data-mc="star"></svg><svg class="mc c" data-mc="bear"></svg><svg class="mc d" data-mc="cat"></svg>
    </div>
    <span class="cue" id="cue" hidden aria-hidden="true"></span>
  </section>

  <div id="rest" hidden>
  <section class="letter">
    <h2 data-k="letterTitle"></h2>
    <div id="lbody"></div>
    <p class="sign" data-k="signoff"></p>
  </section>

  <section>
    <h2 data-k="starsTitle"></h2>
    <div class="sky" id="stars"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline id="line"/></svg></div>

    <p class="fin" id="fin" data-k="finale" hidden></p>
  </section>
</div>
</main>

<script>
const SRC="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
/* ✏️ EDIT EVERYTHING HERE. Change only the text between the quotation marks. */
const S={
  name:"Zahra",
  gateText:"Zahra, I have a little surprise for you.",
  openButton:"Open your surprise 🎁",
  lightButton:"Light the candles 🕯️",

/* night sky + sparkles */
const sk=$("#sky"),fx=$("#fx"),sc=sk.getContext("2d"),fc=fx.getContext("2d");
let W=0,H=0,ps=[],shoot=null;
const mkStar=()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.3,p:Math.random()*6.28,s:.6+Math.random()*1.4});
const stars=Array.from({length:SN[D.stars]??140},mkStar);
function fit(){const r=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  for(const c of [sk,fx]){c.width=W*r;c.height=H*r}
  sc.setTransform(r,0,0,r,0,0);fc.setTransform(r,0,0,r,0,0)}

const G=["✦","♥","✧","♥"],C=["#f6c86b","#ff7c9c","#fff3e0","#ffb4c6"];
function burst(x,y,k){
  if(reduce)k=Math.min(k,14);
  for(let i=0;i<k;i++){const a=Math.random()*6.283,v=2+Math.random()*7;
    ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,g:G[i%4],c:C[i%4],z:12+Math.random()*16,r:Math.random()*6,vr:(Math.random()-.5)*.15,l:1})}
}
function frame(t){
  sc.clearRect(0,0,W,H);sc.fillStyle="#fff3e0";
  for(const s of stars){sc.globalAlpha=reduce?.7:.45+.45*Math.sin(t/1000*s.s+s.p);sc.beginPath();sc.arc(s.x*W,s.y*H,s.r,0,6.283);sc.fill()}
  sc.globalAlpha=1;
  if(!reduce){
    if(!shoot&&Math.random()<.003)shoot={x:W*(.3+Math.random()*.7),y:H*Math.random()*.35,l:1};
    if(shoot){shoot.x-=9;shoot.y+=4.5;shoot.l-=.014;
      const g=sc.createLinearGradient(shoot.x,shoot.y,shoot.x+90,shoot.y-45);
      g.addColorStop(0,"rgba(255,243,224,"+Math.max(shoot.l,0)+")");g.addColorStop(1,"rgba(255,243,224,0)");
      sc.strokeStyle=g;sc.lineWidth=1.6;sc.beginPath();sc.moveTo(shoot.x,shoot.y);sc.lineTo(shoot.x+90,shoot.y-45);sc.stroke();
      if(shoot.l<=0)shoot=null}
  }
  fc.clearRect(0,0,W,H);
  ps=ps.filter(p=>p.l>0&&p.y<H+60&&p.y>-90);
  fc.textAlign="center";fc.textBaseline="middle";
  for(const p of ps){
    if(p.t==="p"){p.vy+=.12;p.vx*=.965;p.vy*=.965;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.f+=.22;p.l-=.0032;
      fc.save();fc.globalAlpha=Math.min(p.l*3,1);fc.translate(p.x,p.y);fc.rotate(p.r);fc.scale(1,Math.cos(p.f));fc.fillStyle=p.c;fc.fillRect(-p.w/2,-p.h/2,p.w,p.h);fc.restore();continue}
    if(p.t==="s"){p.y+=p.vy;p.x+=Math.sin(p.y/60+p.f)*.7;p.r+=p.vr;
      fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillStyle=p.c;fc.beginPath();fc.ellipse(0,0,p.z,p.z*.55,0,0,6.283);fc.fill();fc.restore();continue}
    if(p.t==="c"){p.y+=p.vy;p.x+=Math.sin(p.y/45+p.f)*.9;p.r+=p.vr;
      fc.save();fc.globalAlpha=p.a||1;fc.translate(p.x,p.y);fc.rotate(p.r);fc.font=p.z+"px sans-serif";fc.fillText(p.g,0,0);fc.restore();continue}
    p.vy+=.12;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.008;
    fc.save();fc.globalAlpha=Math.min(p.l*1.5,1);fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillStyle=p.c;fc.font=p.z+"px sans-serif";fc.fillText(p.g,0,0);fc.restore()}
  requestAnimationFrame(frame);
}
