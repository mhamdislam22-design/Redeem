<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Happy birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&family=Manrope:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--a:#ff4fa3;--b:#ff8fcb;--c:#ffd6ec;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:#fff;font:400 16px/1.7 var(--fb,"Manrope"),system-ui,sans-serif;overflow:hidden}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
body::after{content:"";position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(0,0,0,.72) 100%)}
.serif{font-family:var(--ft,"Fraunces"),Georgia,serif;font-style:var(--fs,italic);font-weight:300}
#start{position:fixed;inset:0;z-index:10;background:#000;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;padding:24px;transition:opacity .9s}
#start.off{opacity:0;pointer-events:none}
#start h1{margin:0;font-size:clamp(34px,9vw,56px);line-height:1.2;text-shadow:0 0 30px var(--a)}
#start p{margin:0 0 18px;color:var(--b);font-size:clamp(18px,4.6vw,24px)}
.hb{font-size:56px;line-height:1.2;filter:drop-shadow(0 0 18px var(--a));animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.btn{font:700 15px var(--fw,"Manrope"),system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--c);background:rgba(255,79,163,.14);border:1px solid var(--a);border-radius:999px;padding:13px 30px;cursor:pointer;box-shadow:0 0 24px rgba(255,79,163,.35)}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--c);outline-offset:3px}
#open{position:fixed;left:50%;bottom:calc(26px + var(--bot));transform:translateX(-50%);z-index:5;opacity:0;pointer-events:none;transition:opacity 1.2s}
#open.on{opacity:1;pointer-events:auto}
#open:active{transform:translateX(-50%) scale(.96)}
#msg{color:#ffb3d1;font-size:14px;min-height:1.5em}
#mute{position:fixed;top:calc(12px + var(--top));right:12px;z-index:6;width:42px;height:42px;border-radius:50%;border:1px solid var(--a);background:rgba(0,0,0,.4);color:var(--c);font-size:18px;cursor:pointer}
#letter{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:rgba(20,0,16,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fade .6s both}
@keyframes fade{from{opacity:0}}
.card{width:min(100%,380px);max-height:86vh;overflow:auto;text-align:center;padding:26px 22px;border:1px solid rgba(255,79,163,.35);border-radius:22px;background:rgba(30,4,28,.72);box-shadow:0 0 60px rgba(255,79,163,.25)}
.card img{display:block;width:84px;height:88px;margin:0 auto 8px;filter:drop-shadow(0 0 12px var(--a))}
.card h2{margin:0 0 10px;font-size:30px;line-height:1.3;color:var(--c)}
.card p{margin:0 0 20px;color:#f6dcea;white-space:pre-line}
@media (prefers-reduced-motion:reduce){.hb{animation:none}}
#gbtn{position:fixed;left:50%;bottom:calc(84px + var(--bot));transform:translateX(-50%);z-index:5;opacity:0;pointer-events:none;transition:opacity 1.2s;white-space:nowrap}
#gbtn.on{opacity:1;pointer-events:auto}
#gbtn:active{transform:translateX(-50%) scale(.96)}
#since{position:fixed;top:calc(14px + var(--top));left:50%;transform:translateX(-50%);z-index:5;font-size:13px;letter-spacing:.06em;color:var(--c);padding:6px 14px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(0,0,0,.35);opacity:0;transition:opacity 1.2s;white-space:nowrap}
#since:empty{display:none}
#since.on{opacity:1}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,10px);z-index:8;max-width:min(86vw,340px);text-align:center;padding:14px 18px;border-radius:18px;color:var(--c);background:rgba(30,4,28,.78);border:1px solid rgba(255,79,163,.4);box-shadow:0 0 40px rgba(255,79,163,.3);opacity:0;pointer-events:none;transition:all .5s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#gm{position:fixed;inset:0;z-index:20;background:rgba(14,0,12,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;grid-template-rows:auto 1fr;touch-action:manipulation}
#gh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(14px + var(--top)) 18px 10px;font-size:17px}
#gh b{color:var(--c)}
#gp{position:relative;overflow:hidden}
.gt{position:absolute;bottom:-70px;font-size:46px;line-height:1;background:none;border:0;padding:6px;cursor:pointer;filter:drop-shadow(0 0 12px var(--a));animation:gup var(--d) linear forwards}
@keyframes gup{to{transform:translateY(-120vh)}}
.gt.pop{animation:gpop .3s forwards}
@keyframes gpop{to{transform:scale(1.8);opacity:0}}
#gr{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:24px;background:rgba(14,0,12,.72)}
#gr p{margin:0;font-size:26px;line-height:1.4;color:var(--c);max-width:320px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start">
  <div class="hb" aria-hidden="true">💗</div>
  <h1 class="serif" data-k="title"></h1>
  <p data-k="intro"></p>
  <button class="btn" id="go" data-k="startBtn"></button>
  <div id="msg" role="status"></div>
</div>

<button class="btn" id="open" data-k="letterBtn"></button>
<button id="mute" hidden aria-label="Play or pause the music">♪</button>
<button class="btn" id="gbtn" hidden></button>
<div id="since"></div>
<div id="toast" role="status"></div>
<div id="gm" hidden role="dialog" aria-modal="true">
  <div id="gh"><b id="gt1"></b><span id="gs">0</span><span id="gtime">0</span><button class="btn" id="gx" aria-label="Close">✕</button></div>
  <div id="gp"></div>
  <div id="gr" hidden><p id="gmsg"></p><button class="btn" id="gagain"></button><button class="btn" id="gclose"></button></div>
</div>

<div id="letter" hidden role="dialog" aria-modal="true">
  <div class="card">
    <img id="lcat" alt="">
    <h2 class="serif" data-k="letterTitle"></h2>
    <p data-k="letter"></p>
    <button class="btn" id="close" data-k="closeBtn"></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ✏️ Easiest: open studio.html on your site and edit with buttons. This block is plain JSON, so you can also edit it by hand. */
const S=/*SETTINGS*/{
 "name": "Zahra",
 "title": "Happy birthday, my love",
 "intro": "Zahra, I made you something.",
 "startBtn": "Tap to begin",
 "words": [
  "HAPPY BIRTHDAY",
  "ZAHRA",
  "MY LOVE",
  "ALWAYS U",
  "LOVE U THE MOST",
  "MY HEART",
  "ONLY U",
  "FOREVER"
 ],
 "letterBtn": "Open your letter",
 "letterTitle": "A letter for you",
 "letter": "Zahra, happy birthday!\n\nThank you for every laugh, every quiet moment, and every day that feels like home when you are in it. I hope this year gives you everything you wish for.\n\nI’m proud of you, I’m lucky to have you, and I love you more than all these stars can say.",
 "closeBtn": "Close",
 "theme": "pink",
 "colors": null,
 "speed": 1,
 "spin": 1,
 "orbit": 1,
 "ring": 1,
 "glow": 1,
 "density": "auto",
 "fontTitle": "Fraunces",
 "fontWords": "Manrope",
 "fontBody": "Manrope",
 "stickers": [
  "bunny",
  "bear",
  "cat"
 ],
 "stickerSize": 1,
 "hearts": 12,
 "photos": [],
 "music": "birthday",
 "tempo": 100,
 "volume": 0.5,
 "game": {
  "on": true,
  "btn": "Play a little game",
  "title": "Catch my hearts",
  "goal": 12,
  "time": 25,
  "emoji": [
   "💗",
   "🧸",
   "🎀",
   "⭐",
   "🌸"
  ],
  "win": "You caught every heart… and you already have mine.",
  "lose": "So close! Try again.",
  "again": "Play again"
 },
 "notes": [
  "You make ordinary days feel like magic.",
  "Your laugh is my favorite sound.",
  "I’d choose you in every universe."
 ],
 "notesHint": "Tap the floating hearts 💗",
 "since": "",
 "sinceText": "Together for"
}/*END*/;

function boot(){
const $=id=>document.getElementById(id);
$("letter").querySelectorAll("h2,p").forEach(e=>e.setAttribute("dir","auto"));
document.querySelectorAll("[data-k]").forEach(e=>e.textContent=S[e.dataset.k]);
document.title=S.title;
if(!window.THREE){$("msg").textContent="Couldn’t load the 3D engine. Check your internet connection and refresh.";return}
let bad=false;const ce=console.error;
console.error=function(){if(/WebGLProgram|Shader/i.test(String(arguments[0])))bad=true;return ce.apply(console,arguments)};

const TH={pink:["#ff4fa3","#ff8fcb","#ffd6ec"],violet:["#8b6cff","#b9a6ff","#ece6ff"],blue:["#3db8ff","#8fdcff","#e3f6ff"],gold:["#ffb000","#ffd25e","#fff4cc"]};
const css=(Array.isArray(S.colors)&&S.colors.length>=3)?S.colors:(TH[S.theme]||TH.pink),P=css.map(c=>new THREE.Color(c));
["--a","--b","--c"].forEach((v,i)=>document.documentElement.style.setProperty(v,css[i]));
const FONTS={Manrope:["Manrope:wght@400;700",0,"system-ui,sans-serif"],Fraunces:["Fraunces:ital,opsz,wght@1,9..144,300",1,"Georgia,serif"],Pacifico:["Pacifico",0,"cursive"],"Dancing Script":["Dancing+Script:wght@400;700",0,"cursive"],"Great Vibes":["Great+Vibes",0,"cursive"],Orbitron:["Orbitron:wght@400;700",0,"sans-serif"],Cairo:["Cairo:wght@400;700",0,"sans-serif"],Amiri:["Amiri:wght@400;700",0,"serif"],"Aref Ruqaa":["Aref+Ruqaa:wght@400;700",0,"serif"],Tajawal:["Tajawal:wght@400;700",0,"sans-serif"],Lalezar:["Lalezar",0,"sans-serif"]};
function useFont(n,v){const f=FONTS[n]||FONTS.Manrope;
  if(!document.querySelector('link[data-f="'+n+'"]')){const l=document.createElement("link");l.rel="stylesheet";l.dataset.f=n;l.href="https://fonts.googleapis.com/css2?family="+f[0]+"&display=swap";document.head.append(l)}
  document.documentElement.style.setProperty("--"+v,'"'+n+'",'+f[2]);return n}
const FT=useFont(S.fontTitle,"ft"),FB=useFont(S.fontBody,"fb"),FW=useFont(S.fontWords,"fw");
document.documentElement.style.setProperty("--fs",(FONTS[FT]||FONTS.Manrope)[1]?"italic":"normal");
const rnd=Math.random,gs=()=>(rnd()+rnd()+rnd()-1.5)/1.5,tmp=new THREE.Color();

/* quality tier: more dots on strong phones, fewer on weak ones (it also adapts while running) */
const Q={low:[8000,3200,500,700],normal:[16000,6000,900,1200],high:[26000,9000,1400,1800],ultra:[40000,14000,2200,2500]};
let tier=S.density;
if(!Q[tier]){const c=navigator.hardwareConcurrency||4,m=navigator.deviceMemory||4;tier=(c<=4||m<=3)?"low":(c<8||m<6)?"normal":"high"}
const [NG,NH,NF,NS]=Q[tier];
let pr=Math.min(window.devicePixelRatio||1,tier==="low"?1.25:1.75),frac=1;

/* renderer, scene, camera */
const cv=$("c");let R;
try{R=new THREE.WebGLRenderer({canvas:cv,antialias:false,powerPreference:"high-performance"})}
catch(e){$("msg").textContent="Your browser couldn’t start 3D graphics. Try Chrome or Safari.";return}
R.setPixelRatio(pr);R.setClearColor(0x000000);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(52,1,.1,400);
const U={uTime:{value:0},uScale:{value:1000}};
function fit(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();U.uScale.value=R.domElement.height/(2*Math.tan(cam.fov*Math.PI/360))}
addEventListener("resize",fit);fit();
const maxA=R.capabilities.getMaxAnisotropy();

/* GPU particle shaders: every dot twinkles, the galaxy turns faster in the middle, and dots fly in to form the scene */
const FS="varying vec3 vCol;varying float vA;void main(){vec2 d=gl_PointCoord-vec2(0.5);float r2=dot(d,d)*4.0;float a=exp(-r2*4.0)*(1.0-smoothstep(0.7,1.0,r2));gl_FragColor=vec4(vCol,a*vA);}";
const HEAD="uniform float uTime;uniform float uScale;uniform float uProg;uniform float uGain;uniform float uBeat;attribute vec3 aStart;attribute vec4 aRnd;attribute vec3 aCol;varying vec3 vCol;varying float vA;";
const FORM="float k=clamp(uProg*1.3-aRnd.z*0.3,0.0,1.0);k=1.0-pow(1.0-k,3.0);vec3 p=mix(aStart,position,k);";
const VS_G=HEAD+"void main(){"+FORM+"float r=length(position.xz);float an=uTime*0.5/(0.8+r*0.5);float c=cos(an);float s=sin(an);p=vec3(c*p.x-s*p.z,p.y,s*p.x+c*p.z);vec4 mv=modelViewMatrix*vec4(p,1.0);gl_Position=projectionMatrix*mv;float tw=0.7+0.3*sin(uTime*(1.2+aRnd.y*2.5)+aRnd.y*50.0);float dep=clamp(1.35-(-mv.z-12.0)/45.0,0.45,1.0);vCol=aCol*uGain;vA=tw*k*dep;gl_PointSize=clamp(aRnd.x*uScale/(-mv.z),1.0,40.0);}";
const VS_H=HEAD+"void main(){"+FORM+"p+=0.05*vec3(sin(uTime*1.7+aRnd.y*30.0),cos(uTime*1.3+aRnd.y*20.0),sin(uTime*1.1+aRnd.y*50.0));p*=uBeat;vec4 mv=modelViewMatrix*vec4(p,1.0);gl_Position=projectionMatrix*mv;float tw=0.6+0.4*sin(uTime*(2.0+aRnd.y*4.0)+aRnd.y*70.0);vCol=aCol*uGain;vA=tw*k;gl_PointSize=clamp(aRnd.x*uScale/(-mv.z),1.0,40.0);}";
const VS_F=HEAD+"void main(){float t=fract(uTime*(0.05+aRnd.z*0.12)+aRnd.y);float h=t*8.2;float a=aRnd.y*40.0+uTime*(0.8+aRnd.z)+t*5.0;float w=aRnd.w*(1.0-t*0.85)*0.9;vec3 p=vec3(cos(a)*w,h+0.25,sin(a)*w);vec4 mv=modelViewMatrix*vec4(p,1.0);gl_Position=projectionMatrix*mv;vCol=aCol*uGain;vA=smoothstep(0.0,0.08,t)*(1.0-smoothstep(0.82,1.0,t))*uProg;gl_PointSize=clamp(aRnd.x*uScale/(-mv.z),1.0,40.0);}";
const VS_S=HEAD+"void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);gl_Position=projectionMatrix*mv;vCol=aCol;vA=(0.35+0.65*(0.5+0.5*sin(uTime*(1.0+aRnd.y*2.5)+aRnd.y*60.0)))*uProg;gl_PointSize=clamp(aRnd.x*uScale/(-mv.z),1.0,6.0);}";

function far(st,i){const a=rnd()*6.283,e=(rnd()-.5)*2,r=25+rnd()*45,c=Math.sqrt(1-e*e);st[i*3]=Math.cos(a)*c*r;st[i*3+1]=e*r*.7;st[i*3+2]=Math.sin(a)*c*r}
function mkPts(n,fill,vs){
  const pos=new Float32Array(n*3),st=new Float32Array(n*3),rn=new Float32Array(n*4),co=new Float32Array(n*3);
  for(let i=0;i<n;i++)fill(i,pos,st,rn,co);
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));g.setAttribute("aStart",new THREE.BufferAttribute(st,3));
  g.setAttribute("aRnd",new THREE.BufferAttribute(rn,4));g.setAttribute("aCol",new THREE.BufferAttribute(co,3));
  const m=new THREE.ShaderMaterial({uniforms:Object.assign({},U,{uProg:{value:0},uGain:{value:S.glow},uBeat:{value:1}}),vertexShader:vs,fragmentShader:FS,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  const p=new THREE.Points(g,m);p.userData.n=n;p.frustumCulled=false;return p;
}
function put(co,i,c,b){co[i*3]=c.r*b;co[i*3+1]=c.g*b;co[i*3+2]=c.b*b}

/* galaxy: bright ring, glowing bulge, three spiral arms with a few brighter stars */
function gFill(i,pos,st,rn,co){
  const u=rnd();let r,a,y,size,b=1;
  if(u<.08){r=.92+gs()*.07;a=rnd()*6.283;y=gs()*.03;size=.045+rnd()*.05;tmp.copy(P[2]);b=1.4}
  else if(u<.28){r=.4+Math.pow(rnd(),1.6)*2.2;a=rnd()*6.283;y=gs()*.5*(1-r/3);size=.03+rnd()*.045;tmp.copy(P[2]).lerp(P[1],r/3);b=.9}
  else{r=1.1+Math.pow(rnd(),1.5)*7.1;a=(i%3)/3*6.283+r*.78+gs()*.6*(1-r/10);y=gs()*.12*Math.exp(-r*.12);size=.03+rnd()*.04;
    const m=Math.min(1,(r-1)/7);tmp.copy(P[2]).lerp(P[1],Math.min(1,m*2.2)).lerp(P[0],Math.max(0,m*2-.6));b=.55+rnd()*.7;
    if(rnd()<.03){size*=2.6;tmp.copy(P[2]);b=1.5}}
  pos[i*3]=Math.cos(a)*r;pos[i*3+1]=y;pos[i*3+2]=Math.sin(a)*r;
  far(st,i);rn[i*4]=size;rn[i*4+1]=rnd();rn[i*4+2]=rnd();put(co,i,tmp,b);
}
/* heart: a real 3D volume, thick in the middle and thin at the rim, with a few sparks drifting off */
const K=.2;
function hFill(i,pos,st,rn,co){
  const t=rnd()*6.283,x=16*Math.pow(Math.sin(t),3),yv=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t),u=rnd();
  let f,size=.05+rnd()*.05,b=.8+rnd()*.5;
  if(u<.62)f=.9+rnd()*.1;else if(u<.9)f=Math.sqrt(rnd())*.9;else{f=1.02+rnd()*.28;size*=.8;b*=.7}
  const ff=Math.min(f,1),th=Math.sqrt(1-ff*ff)*2+.1;
  pos[i*3]=x*f*K;pos[i*3+1]=(yv*f+2.5)*K;pos[i*3+2]=(rnd()-.5)*th;
  tmp.copy(P[0]).lerp(P[1],Math.min(1,Math.max(0,(yv+17)/29))).lerp(P[2],Math.max(0,f-.85)/.15*.6);
  far(st,i);rn[i*4]=size;rn[i*4+1]=rnd();rn[i*4+2]=rnd();put(co,i,tmp,b);
}
function fFill(i,pos,st,rn,co){rn[i*4]=.04+rnd()*.07;rn[i*4+1]=rnd();rn[i*4+2]=rnd();rn[i*4+3]=.1+rnd()*.5;tmp.copy(P[1]).lerp(P[2],rnd());put(co,i,tmp,1)}
function sFill(i,pos,st,rn,co){
  const a=rnd()*6.283,e=(rnd()-.5)*2,r=90+rnd()*50,c=Math.sqrt(1-e*e);
  pos[i*3]=Math.cos(a)*c*r;pos[i*3+1]=e*r;pos[i*3+2]=Math.sin(a)*c*r;
  rn[i*4]=.1+rnd()*.15;rn[i*4+1]=rnd();tmp.copy(rnd()<.5?P[2]:P[1]);put(co,i,tmp,.45+rnd()*.55);
}

const fades=[],world=new THREE.Group();sc.add(world);
const galaxy=mkPts(NG,gFill,VS_G);world.add(galaxy);galaxy.material.uniforms.uTime={value:0};
const heartG=new THREE.Group();heartG.position.y=5.4;world.add(heartG);
const heart=mkPts(NH,hFill,VS_H);heartG.add(heart);
const fountain=mkPts(NF,fFill,VS_F);world.add(fountain);
const stars=mkPts(NS,sFill,VS_S);sc.add(stars);
const clouds=[galaxy,heart,fountain,stars];

/* soft glow behind the core and the heart (a cheap "bloom") */
const gcv=document.createElement("canvas");gcv.width=gcv.height=128;
const gx=gcv.getContext("2d"),gg=gx.createRadialGradient(64,64,0,64,64,64);
gg.addColorStop(0,"rgba(255,255,255,.9)");gg.addColorStop(.25,"rgba(255,255,255,.35)");gg.addColorStop(1,"rgba(255,255,255,0)");
gx.fillStyle=gg;gx.fillRect(0,0,128,128);
const glowTex=new THREE.CanvasTexture(gcv);
function glow(col,s,max,parent,y){
  const m=new THREE.SpriteMaterial({map:glowTex,color:col,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}),sp=new THREE.Sprite(m);
  sp.scale.set(s,s,1);sp.position.y=y;parent.add(sp);fades.push({m,max});
}
glow(P[0],7,.55,world,.3);glow(P[2],2.4,.5,world,.25);glow(P[0],11,.28,heartG,0);

/* sticker art: original little characters, shaded, with a paper-sticker outline */

  bear:'<circle cx="24" cy="30" r="14" fill="url(#p)"/><circle cx="24" cy="30" r="7" fill="#ff8fb8"/><circle cx="76" cy="30" r="14" fill="url(#p)"/><circle cx="76" cy="30" r="7" fill="#ff8fb8"/><ellipse cx="50" cy="92" rx="26" ry="14" fill="url(#p)"/><ellipse cx="50" cy="94" rx="14" ry="9" fill="#fff0f6"/><path d="M50 99c-7-5-10-8-7-11 2.5-2.5 5-.8 7 1.6 2-2.4 4.5-4.1 7-1.6 3 3 0 6-7 11z" fill="#ff5d9e"/><ellipse cx="50" cy="58" rx="36" ry="30" fill="url(#p)"/><ellipse cx="50" cy="68" rx="13" ry="9" fill="#fff0f6"/><g transform="translate(50 60)">'+FACE+'</g>',
  cat:'<path d="M17 52L22 12L47 35Z" fill="url(#w)"/><path d="M24 42L27 24L38 34Z" fill="#ffc2d9"/><path d="M83 52L78 12L53 35Z" fill="url(#w)"/><path d="M76 42L73 24L62 34Z" fill="#ffc2d9"/><ellipse cx="50" cy="92" rx="23" ry="13" fill="url(#w)"/><ellipse cx="50" cy="64" rx="37" ry="29" fill="url(#w)"/><g transform="translate(50 66)">'+FACE+'</g><path d="M10 62h13M10 71l12-3M90 62H77M90 71l-12-3" stroke="#f0a7c4" stroke-width="1.6" stroke-linecap="round" fill="none"/>',
  star:'<path d="M50 8L61 38H93L67 57L77 90L50 70L23 90L33 57L7 38H39Z" fill="#ffd966" stroke="#ffd966" stroke-width="7" stroke-linejoin="round"/><g transform="translate(50 52) scale(.78)">'+FACE+'</g>',
  heart:'<path d="M50 92C12 66 4 44 4 30 4 15 16 6 29 6 40 6 47 12 50 21 53 12 60 6 71 6 84 6 96 15 96 30 96 44 88 66 50 92Z" fill="#ff6fae"/><ellipse cx="25" cy="24" rx="9" ry="5" transform="rotate(-35 25 24)" fill="#fff" opacity=".55"/><g transform="translate(50 46) scale(.95)">'+FACE+'</g>',
  cup:'<path d="M24 56L31 94H69L76 56Z" fill="#ffb3d1"/><path d="M38 58L40 94M50 58V94M62 58L60 94" stroke="#ff8fb8" stroke-width="2" fill="none"/><path d="M18 58C10 44 24 34 34 38 36 24 50 18 58 28 68 22 82 32 74 42 88 44 90 58 76 58Z" fill="#ff8fc2"/><circle cx="54" cy="20" r="6.5" fill="#ff3d6e"/><circle cx="52" cy="18" r="2" fill="#fff" opacity=".7"/><g transform="translate(50 76) scale(.6)">'+FACE+'</g>'
};
const svgUrl=k=>"data:image/svg+xml;charset=utf-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 104">'+DEFS+ART[k]+'</svg>');
$("lcat").src=svgUrl("cat");
function stickerTex(k){
  const c=document.createElement("canvas");c.width=c.height=512;
  const x=c.getContext("2d"),t=new THREE.CanvasTexture(c),im=new Image();t.anisotropy=maxA;
  im.onload=()=>{
    const w=470,h=w*1.04,px=(512-w)/2,py=(512-h)/2+4,o=document.createElement("canvas");o.width=o.height=512;
    const ox=o.getContext("2d");ox.drawImage(im,px,py,w,h);ox.globalCompositeOperation="source-in";ox.fillStyle="#fff";ox.fillRect(0,0,512,512);
    x.shadowColor=css[1];x.shadowBlur=26;
    for(let a=0;a<16;a++)x.drawImage(o,Math.cos(a/16*6.283)*9,Math.sin(a/16*6.283)*9);
    x.shadowBlur=0;x.drawImage(im,px,py,w,h);t.needsUpdate=true;
  };
  im.src=svgUrl(k);return t;
}

/* orbiting ring: neon words, a thin light ring, sticker friends on glowing cushions */
const ringG=new THREE.Group();world.add(ringG);
const Y=new THREE.Vector3(0,1,0),FLAT=-Math.PI/2;
function label(txt){
  const c=document.createElement("canvas");c.width=2048;c.height=256;
  const x=c.getContext("2d");x.font='700 150px "'+FW+'",system-ui,sans-serif';x.textBaseline="middle";
  const ch=[...txt],ws=ch.map(s=>x.measureText(s).width+18),tot=ws.reduce((a,b)=>a+b,0)-18,k=Math.min(1,1880/tot);
  x.translate(1024,128);x.scale(k,k);
  [[44,css[0],css[0]],[16,css[1],css[1]],[0,css[2],css[2]]].forEach(l=>{
    x.shadowBlur=l[0];x.shadowColor=l[1];x.fillStyle=l[2];let cx=-tot/2;ch.forEach((s,i)=>{x.fillText(s,cx,0);cx+=ws[i]});
  });
  const t=new THREE.CanvasTexture(c);t.anisotropy=maxA;return t;
}
function buildWords(){
  const n=S.words.length;
  S.words.forEach((w,i)=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(6,.75),new THREE.MeshBasicMaterial({map:label(w),transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide})),a=i/n*6.283;
    m.position.set(Math.cos(a)*9.6,.06,Math.sin(a)*9.6);m.rotation.x=FLAT;m.rotateOnWorldAxis(Y,Math.PI/2-a);
    ringG.add(m);fades.push({m:m.material,max:1});
  });
}
const rl=new THREE.Mesh(new THREE.RingGeometry(9.1,9.16,180),new THREE.MeshBasicMaterial({color:P[0],transparent:true,opacity:0,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false}));
rl.rotation.x=FLAT;rl.position.y=.04;ringG.add(rl);fades.push({m:rl.material,max:.55});
const friends=[];
S.stickers.filter(k=>ART[k]).forEach((k,i,arr)=>{
  const a=(i+.5)/arr.length*6.283+.5,s=new THREE.Sprite(new THREE.SpriteMaterial({map:stickerTex(k),transparent:true,opacity:0,depthWrite:false}));
  s.scale.set(1.75*S.stickerSize,1.75*S.stickerSize,1);s.userData={a,i};ringG.add(s);fades.push({m:s.material,max:1});friends.push(s);
  const d=new THREE.Mesh(new THREE.CircleGeometry(.95,40),new THREE.MeshBasicMaterial({color:P[0],transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  d.rotation.x=FLAT;d.position.set(Math.cos(a)*6.7,.05,Math.sin(a)*6.7);ringG.add(d);fades.push({m:d.material,max:.4});
});

/* your photos, floating as little polaroids */
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
const frames=[];
(S.photos||[]).slice(0,8).forEach((u,i,arr)=>{
  const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d"),t=new THREE.CanvasTexture(c),im=new Image();t.anisotropy=maxA;
  im.onload=()=>{const w=400,h=420,px=56,py=36;x.shadowColor=css[1];x.shadowBlur=30;x.fillStyle="#fff";rr(x,px-14,py-14,w+28,h+28+36,22);x.fill();x.shadowBlur=0;
    x.save();rr(x,px,py,w,h,12);x.clip();const k=Math.max(w/im.width,h/im.height),dw=im.width*k,dh=im.height*k;x.drawImage(im,px+(w-dw)/2,py+(h-dh)/2,dw,dh);x.restore();t.needsUpdate=true};
  im.src=u;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,opacity:0,depthWrite:false}));
  s.scale.set(2.2,2.2,1);s.userData={a:(i+.5)/arr.length*6.283+1.2,i};ringG.add(s);fades.push({m:s.material,max:1});frames.push(s);
});

/* floating glossy 3D hearts with real lighting */
sc.add(new THREE.AmbientLight(0xffc0dc,.55));
const l1=new THREE.PointLight(0xffffff,1.1,90);l1.position.set(8,14,10);sc.add(l1);
const l2=new THREE.PointLight(P[0],1.6,60);l2.position.set(0,3,0);sc.add(l2);
const hsh=new THREE.Shape();hsh.moveTo(0,-.9);hsh.bezierCurveTo(-1.3,-.05,-.7,.95,0,.4);hsh.bezierCurveTo(.7,.95,1.3,-.05,0,-.9);
const hgeo=new THREE.ExtrudeGeometry(hsh,{depth:.35,bevelEnabled:true,bevelThickness:.3,bevelSize:.25,bevelSegments:6,curveSegments:28});hgeo.center();
const hmat=new THREE.MeshPhongMaterial({color:P[0],specular:0xffffff,shininess:140,emissive:P[0].clone().multiplyScalar(.25),transparent:true,opacity:0});
fades.push({m:hmat,max:1});
const hearts=[];
for(let i=0;i<S.hearts;i++){
  const h=new THREE.Mesh(hgeo,hmat);
  h.userData={i,r:3.4+(i*1.7)%6.2,y:1.2+(i*2.3)%5.6,sz:(.8+(i*.37)%.9)*.32,sp:.1+(i%5)*.03};
  world.add(h);hearts.push(h);
}

/* drag to look around */
let az=.6,el=.7,drag=null,started=false,t0=0,last=performance.now(),fpsT=last,fpsN=0,fb=false,gt=0;
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",e=>{if(!drag)return;az-=(e.clientX-drag.x)*.006;el=Math.min(1.25,Math.max(.12,el+(e.clientY-drag.y)*.004));drag.x=e.clientX;drag.y=e.clientY});
["pointerup","pointercancel"].forEach(n=>cv.addEventListener(n,()=>{drag=null}));

const ease=u=>1-Math.pow(1-Math.min(1,Math.max(0,u)),3),prog=(a,b)=>Math.min(1,Math.max(0,a/b));
function applyFrac(){clouds.forEach(p=>p.geometry.setDrawRange(0,Math.floor(p.userData.n*frac)))}
/* safety net: if a phone can't compile the shaders, fall back to plain dots */
function fallback(){
  clouds.forEach(p=>{p.geometry.setAttribute("color",p.geometry.getAttribute("aCol"));
    p.material=new THREE.PointsMaterial({size:.07,map:glowTex,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})});
  fountain.visible=false;
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000),t=now/1000,sp=S.speed;last=now;
  U.uTime.value=t*sp;gt+=dt*sp*S.spin;galaxy.material.uniforms.uTime.value=gt;
  const age=started?(now-t0)/1000:0;
  if(started){
    galaxy.material.uniforms.uProg.value=prog(age,4.6);
    heart.material.uniforms.uProg.value=prog(age-1.6,3.6);
    fountain.material.uniforms.uProg.value=prog(age-.8,2);
    stars.material.uniforms.uProg.value=prog(age,3);
    const b=Math.sin(t*3.2);heart.material.uniforms.uBeat.value=1+.035*b+.03*Math.max(0,Math.sin(t*6.4));
    const vis=ease((age-3.2)/1.8);fades.forEach(f=>f.m.opacity=vis*f.max);
    ringG.rotation.y+=dt*.12*sp*S.ring;stars.rotation.y=t*.01;
    hearts.forEach(h=>{const u=h.userData,a=u.i*2.4+t*u.sp*sp;h.position.set(Math.cos(a)*u.r,u.y+Math.sin(t*.8+u.i)*.4,Math.sin(a)*u.r);
      const z=u.sz*(1+.06*Math.sin(t*3+u.i)+(u.bump||0)*.55);u.bump=(u.bump||0)*.93;h.scale.set(z,z,z);h.rotation.y=t*.6+u.i;h.rotation.x=Math.sin(t*.5+u.i)*.3});
    friends.forEach(s=>{const u=s.userData,hop=Math.abs(Math.sin(t*2.2+u.i*1.7));
      s.position.set(Math.cos(u.a)*6.7,.9+hop*.35,Math.sin(u.a)*6.7);s.scale.set(1.75*S.stickerSize*(1-hop*.04),1.75*S.stickerSize*(1+hop*.06),1)});
    frames.forEach(s=>{const u=s.userData;s.position.set(Math.cos(u.a)*8.1,2.7+Math.sin(t*.9+u.i*1.3)*.3,Math.sin(u.a)*8.1)});
  }
  if(!drag)az+=dt*.18*sp*S.orbit;
  const a=cam.aspect,rad=Math.min(34,Math.max(15,15/Math.pow(Math.min(a,1.2),.75)))*(1+(1-ease(age/6))*.8);
  cam.position.set(Math.sin(az)*Math.cos(el)*rad,3.6+Math.sin(el)*rad+Math.sin(t*.2)*.4,Math.cos(az)*Math.cos(el)*rad);cam.lookAt(0,3.2,0);
  heartG.rotation.y=Math.atan2(cam.position.x,cam.position.z)+Math.sin(t*.5*sp)*.55;
  R.render(sc,cam);
  /* adapt quality to the phone: fewer dots / lower resolution if it can't keep up */
  fpsN++;if(now-fpsT>1500){const fps=fpsN*1000/(now-fpsT);fpsN=0;fpsT=now;
    if(started&&age>5&&fps<40&&frac>.3){frac*=.78;applyFrac();if(pr>1){pr=Math.max(1,pr-.25);R.setPixelRatio(pr);fit()}}}
  if(bad&&!fb&&age>.8){fb=true;fallback()}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
Promise.race([document.fonts.load('700 150px "'+FW+'"'),new Promise(r=>setTimeout(r,2500))]).then(buildWords,buildWords);

/* ---------- music made right in the browser (no file needed), letter, game, extras ---------- */
let au=null,synth=null,playing=false;
const mode=String(S.music||"off"),mb=$("mute");
function makeSynth(md){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  const ac=new AC(),out=ac.createGain(),dl=ac.createDelay(),fb2=ac.createGain(),wet=ac.createGain();
  out.gain.value=Math.max(0,Math.min(1,+S.volume||0));dl.delayTime.value=.29;fb2.gain.value=.34;wet.gain.value=.4;
  out.connect(ac.destination);out.connect(dl);dl.connect(fb2);fb2.connect(dl);dl.connect(wet);wet.connect(ac.destination);
  const N={C3:130.81,E3:164.81,F3:174.61,G3:196,A3:220,B3:246.94,C4:261.63,D4:293.66,E4:329.63,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
  const bt=60/Math.max(50,Math.min(160,+S.tempo||100));
  function tone(f,t,d,type,g,att){const o=ac.createOscillator(),e=ac.createGain();o.type=type;o.frequency.value=f;
    e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+(att||.01));e.gain.exponentialRampToValueAtTime(.0008,t+d);
    o.connect(e);e.connect(out);o.start(t);o.stop(t+d+.05)}
  function bday(t){
    const q=[["G4",.75],["G4",.25],["A4",1],["G4",1],["C5",1],["B4",2],["G4",.75],["G4",.25],["A4",1],["G4",1],["D5",1],["C5",2],["G4",.75],["G4",.25],["G5",1],["E5",1],["C5",1],["B4",1],["A4",1],["F5",.75],["F5",.25],["E5",1],["C5",1],["D5",1],["C5",2]];
    q.forEach(n=>{tone(N[n[0]],t,n[1]*bt*1.7,"sine",.3);tone(N[n[0]]*2,t,n[1]*bt*.9,"triangle",.08);t+=n[1]*bt});return t+2*bt;
  }
  function dream(t){
    [["C3","E4","G4","B4"],["A3","C4","E4","G4"],["F3","A3","C4","E4"],["G3","B3","D4","E4"]].forEach(c=>{
      c.forEach(n=>tone(N[n],t,4*bt,"triangle",.1,1.1));
      for(let i=0;i<8;i++)tone(N[c[i%4]]*2,t+i*bt*.5,bt*1.6,"sine",.07);t+=4*bt});return t;
  }
  let timer=0;
  function run(){
    if(ac.state!=="running"){timer=setTimeout(run,400);return}
    const end=(md==="dreamy"?dream:bday)(ac.currentTime+.1);timer=setTimeout(run,Math.max(400,(end-ac.currentTime-.2)*1000));
  }
  return{play(){ac.resume();if(!timer)run()},pause(){ac.suspend()}};
}
function musicOn(on){playing=on;if(synth)on?synth.play():synth.pause();if(au)on?au.play().catch(()=>{}):au.pause();mb.textContent=on?"♪":"✕"}
if(mode!=="off"&&mode){mb.hidden=false;if(mode.indexOf(".")>0){au=new Audio(mode);au.loop=true;au.volume=Math.max(0,Math.min(1,+S.volume||0))}}
mb.onclick=()=>musicOn(!playing);

let tTimer=0;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove("on"),3800)}
const ray=new THREE.Raycaster(),v2=new THREE.Vector2();let pd=null,ni=0;
cv.addEventListener("pointerdown",e=>{pd={x:e.clientX,y:e.clientY}});
cv.addEventListener("pointerup",e=>{
  const ok=pd&&Math.hypot(e.clientX-pd.x,e.clientY-pd.y)<9;pd=null;
  if(!ok||!started||!(S.notes&&S.notes.length))return;
  v2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(v2,cam);
  const h=ray.intersectObjects(hearts,false)[0];
  if(h){toast(S.notes[ni++%S.notes.length]);h.object.userData.bump=1}
});

function gameInit(){
  const G=S.game||{};if(!G.on)return;
  const gb=$("gbtn"),gp=$("gp"),em=(G.emoji&&G.emoji.length)?G.emoji:["💗"];
  let score=0,left=0,timer=0,spawn=0,run=false;
  function stop(){run=false;clearInterval(timer);clearInterval(spawn);gp.innerHTML=""}
  function end(win){stop();$("gmsg").textContent=win?G.win:G.lose;$("gagain").textContent=G.again||"Again";$("gclose").textContent=S.closeBtn;$("gr").hidden=false;if(win&&navigator.vibrate)navigator.vibrate([60,40,60])}
  function start(){
    stop();score=0;left=+G.time||25;run=true;$("gt1").textContent=G.title||"";$("gs").textContent="0 / "+G.goal;$("gtime").textContent=left;$("gr").hidden=true;
    timer=setInterval(()=>{left--;$("gtime").textContent=left;if(left<=0)end(false)},1000);
    spawn=setInterval(()=>{if(!run)return;
      const b=document.createElement("button");b.className="gt";b.textContent=em[Math.floor(Math.random()*em.length)];
      b.style.left=(4+Math.random()*82)+"%";b.style.setProperty("--d",(3.2+Math.random()*2.6)+"s");
      b.onpointerdown=ev=>{ev.preventDefault();if(b.classList.contains("pop"))return;b.classList.add("pop");setTimeout(()=>b.remove(),300);score++;$("gs").textContent=score+" / "+G.goal;if(score>=G.goal)end(true)};
      b.addEventListener("animationend",ev=>{if(ev.animationName==="gup")b.remove()});gp.append(b)},520);
  }
  gb.hidden=false;gb.textContent=G.btn||"Play";
  gb.onclick=()=>{$("gm").hidden=false;start()};
  $("gagain").onclick=start;
  const shut=()=>{stop();$("gm").hidden=true};
  $("gclose").onclick=shut;$("gx").onclick=shut;
}
function sinceInit(){if(!S.since)return;const d=new Date(S.since+"T00:00:00");if(isNaN(d))return;$("since").textContent=(S.sinceText||"Together for")+" "+Math.max(0,Math.floor((Date.now()-d)/864e5))+" days"}

$("go").onclick=()=>{
  $("start").classList.add("off");setTimeout(()=>{$("start").hidden=true},950);
  started=true;t0=performance.now();
  if(mode==="birthday"||mode==="dreamy")synth=makeSynth(mode);
  if(mode!=="off"&&mode)musicOn(true);
  sinceInit();
  setTimeout(()=>{$("open").classList.add("on");if(S.game&&S.game.on)$("gbtn").classList.add("on");$("since").classList.add("on")},7000);
  if(S.notes&&S.notes.length&&S.notesHint)setTimeout(()=>toast(S.notesHint),10500);
};
$("open").onclick=()=>{$("letter").hidden=false};
$("close").onclick=()=>{$("letter").hidden=true};
gameInit();
}
if(/[?&]preview/.test(location.search)){
  addEventListener("message",function(e){const d=e.data||{};
    if(d.zcfg&&!window.__zb){window.__zb=1;Object.assign(S,d.zcfg);boot();document.getElementById("go").onclick()}
    else if(d.zlive)Object.assign(S,d.zlive)});
  parent.postMessage({zready:1},"*");
}else boot();
</script>
